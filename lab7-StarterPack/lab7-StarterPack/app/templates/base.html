<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Moja Strona{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Główny skrypt modułowy -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('ui.index') }}">Moja Strona</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('ui.index') }}">Strona Główna</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('ui.practice') }}">Warsztat miniSIEM</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="py-4 bg-dark text-center text-white mt-auto">
  <p class="mb-0">© 2025 Moja Strona - Lab 7</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
